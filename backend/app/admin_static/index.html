<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SakayApp Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/admin-static/admin.css">
</head>
<body>
  <!-- Sign in -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card">
      <h1>SakayApp Admin</h1>
      <p class="muted">Route, landmark and fare data entry</p>
      <label>Email <input name="email" type="email" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- Main app -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <header class="sidebar-head">
        <strong>SakayApp Admin</strong>
        <button id="logout" class="link">Sign out</button>
      </header>
      <nav class="tabs" role="tablist">
        <button data-tab="routes" class="active">Routes</button>
        <button data-tab="landmarks">Landmarks</button>
        <button data-tab="fares">Fares</button>
        <button data-tab="test">Test trip</button>
      </nav>
      <div id="panel" class="panel"></div>
      <footer id="status" class="status"></footer>
    </aside>
    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/admin-static/geo.js"></script>
  <script src="/admin-static/admin.js"></script>
</body>
</html>
